spring.application.name=conversion-devises

# Port d ecoute (surchargable via .env)
server.port=${SERVER_PORT:8080}

# ===== API de taux de change (Exchangerate-API v6) =====
# Les variables sont lues depuis le fichier .env (non versionne) ou de l environnement.
# Cle vide par defaut : l application demarre mais renvoie une erreur claire a l appel.
exchange.api.api-key=${EXCHANGE_RATE_API_KEY:}
exchange.api.base-url=${EXCHANGE_RATE_API_BASE_URL:https://v6.exchangerate-api.com/v6}
# Duree de mise en cache des taux de change (en minutes)
exchange.api.cache-taux-minutes=${EXCHANGE_RATE_CACHE_MINUTES:60}

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Logs =====
logging.level.com.k48.leonel.conversiondevises=INFO
